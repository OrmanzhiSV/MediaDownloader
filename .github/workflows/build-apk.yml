name: Build Mobile App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Get Date
      id: get-date
      run: |
        echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

    # Самый чистый и стабильный запуск. Мы передаем флаги ANDROID_*, 
    # которые заставляют Buildozer пропустить устаревшие проверки пакетов.
    - name: Run Buildozer Build inside Container
      run: |
        docker run --rm \
          -u 0:0 \
          -v "$(pwd)":/github/workspace \
          -w /github/workspace \
          -e BUILDOZER_WARN_ON_ROOT=0 \
          -e APP_ANDROID_ACCEPT_SDK_LICENSE="true" \
          -e ANDROID_BRAND="google" \
          ghcr.io/kivy/buildozer:latest android debug

    # Выгрузка APK артефактов из выходной папки проекта хоста
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MediaDownloader-APK-${{ env.date }}
        path: |
          bin/*.apk
          .buildozer/**/*.apk
          **/*.apk
