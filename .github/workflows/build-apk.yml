name: Build Mobile App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Get Date
      id: get-date
      run: |
        echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

    # Сборка через современный компилятор python-for-android внутри Docker.
    # Метод полностью автономен и изолирован от багов верификации путей утилиты Buildozer!
    - name: Run Direct Compiler via Docker
      run: |
        docker run --rm \
          -u 0:0 \
          --entrypoint /bin/bash \
          -v "$(pwd)":/github/workspace \
          -w /github/workspace \
          ghcr.io/kivy/buildozer:latest -c "
            # 1. Принудительно генерируем одобренные лицензии Google внутри системного профиля контейнера
            mkdir -p /root/.buildozer/android/platform/android-sdk/licenses
            echo -e '\n893a5cd8e1b672669ab80f8db3ad48a32396d93a\n45f2d2d0b7b672669ab80f8db3ad48a32396d93a\n24333f1a50b6a8d67385315074ed226d875080be' > /root/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
            echo -e '\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910' > /root/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license
            
            # Активируем внутреннее глобальное окружение Kivy, зашитое авторами контейнера
            export PATH=/home/user/.venv/bin:\$PATH
            
            # Создаем целевую выходную папку bin на хосте
            mkdir -p /github/workspace/bin
            
            # 2. Запускаем компиляцию APK напрямую через p4a
            p4a apk \
              --private . \
              --package=org.ormanzhisv.mediadownloader \
              --name='Media Downloader' \
              --version=1.0.0 \
              --bootstrap=sdl2 \
              --requirements=hostpython3,python3,kivy==2.3.0,requests,yt-dlp,urllib3,certifi,idna \
              --arch=arm64-v8a \
              --arch=armeabi-v7a \
              --android-api 34 \
              --output-dir=/github/workspace/bin \
              --release
          "

    # Выгрузка скомпилированных артефактов
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MediaDownloader-APK-${{ env.date }}
        path: bin/*.apk
