name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Get Date
      id: get-date
      run: |
        echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platform-tools'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libsqlite3-dev lld cmake libffi-dev libssl-dev autoconf automake libtool pkg-config zlib1g-dev ccache texinfo git
        python -m pip install --upgrade pip
        python -m pip install "Cython<3.0.0" virtualenv setuptools wheel

    # Новый шаг: Скачиваем исправленный Buildozer напрямую через git во временную папку и устанавливаем его локально
    - name: Install Latest Buildozer from Source
      run: |
        git clone --depth=1 https://github.com /home/runner/buildozer_src
        cd /home/runner/buildozer_src
        python -m pip install .

    - name: Build with Buildozer
      run: |
        # 1. Принимаем лицензии в системном Android SDK
        yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
        
        # 2. Создаем папки для лицензий во внутреннем каталоге
        mkdir -p /home/runner/.buildozer/android/platform/android-sdk/licenses
        mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
        
        # 3. Записываем хэш-ключи официальных лицензий Google напрямую в файлы
        echo -e "\n893a5cd8e1b672669ab80f8db3ad48a32396d93a\n45f2d2d0b7b672669ab80f8db3ad48a32396d93a\n24333f1a50b6a8d67385315074ed226d875080be" > /home/runner/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
        echo -e "\n893a5cd8e1b672669ab80f8db3ad48a32396d93a\n45f2d2d0b7b672669ab80f8db3ad48a32396d93a\n24333f1a50b6a8d67385315074ed226d875080be" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
        
        # 4. Копируем системные одобренные лицензии
        cp -r /usr/local/lib/android/sdk/licenses/* /home/runner/.buildozer/android/platform/android-sdk/licenses/ 2>/dev/null || true
        cp -r /usr/local/lib/android/sdk/licenses/* ~/.buildozer/android/platform/android-sdk/licenses/ 2>/dev/null || true
        
        # 5. Запускаем сборку. Новый Buildozer автоматически распознает современные cmdline-tools от Google!
        buildozer android debug
      env:
        BUILDOZER_WARN_ON_ROOT: 0

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MediaDownloader-APK-${{ env.date }}
        path: bin/*.apk
