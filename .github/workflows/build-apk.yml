name: Build Mobile App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Get Date
      id: get-date
      run: |
        echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

    # Готовим локальную структуру каталогов проекта и предустанавливаем лицензии Google
    - name: Prepare Licenses and Build Directory
      run: |
        mkdir -p .docker_buildozer/android/platform/android-sdk/licenses
        echo -e "\n893a5cd8e1b672669ab80f8db3ad48a32396d93a\n45f2d2d0b7b672669ab80f8db3ad48a32396d93a\n24333f1a50b6a8d67385315074ed226d875080be" > .docker_buildozer/android/platform/android-sdk/licenses/android-sdk-license
        echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910" > .docker_buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license
        chmod -R 777 .docker_buildozer/

    # Сборка через самокорректирующийся Docker-сценарий.
    # Запись скрипта-заглушки sdkmanager упрощена до одной строки через echo, чтобы не ломать YAML.
    - name: Run Buildozer via Manual Docker
      run: |
        docker run --rm \
          -u 0:0 \
          --entrypoint bash \
          -v "$(pwd)":/github/workspace \
          -v "$(pwd)/.docker_buildozer":/home/user/.buildozer \
          -v "$(pwd)/.docker_buildozer":/root/.buildozer \
          -w /github/workspace \
          -e BUILDOZER_WARN_ON_ROOT=0 \
          ghcr.io/kivy/buildozer:latest -c "
            buildozer android debug || {
              echo 'Создаем исполняемый файл-мост для sdkmanager...';
              
              rm -rf /root/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
              rm -rf /home/user/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
              
              mkdir -p /root/.buildozer/android/platform/android-sdk/tools/bin/
              mkdir -p /home/user/.buildozer/android/platform/android-sdk/tools/bin/
              
              # Записываем чистый bash-скрипт в одну строку в оба профиля системы
              echo '#!/bin/bash' > /root/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
              echo '/root/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager \"\$@\"' >> /root/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
              chmod +x /root/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
              
              echo '#!/bin/bash' > /home/user/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
              echo '/root/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager \"\$@\"' >> /home/user/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
              chmod +x /home/user/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
              
              echo 'Повторный запуск финальной компиляции...';
              buildozer android debug
            }
          "

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MediaDownloader-APK-${{ env.date }}
        path: bin/*.apk
