name: Build Mobile App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get Date
        id: get-date
        run: echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_ENV"

      - name: Prepare SDK inside container
        timeout-minutes: 30
        run: |
          docker run --rm -u 0:0 \
            -v "$(pwd)":/github/workspace \
            -w /github/workspace \
            -e BUILDOZER_WARN_ON_ROOT=0 \
            -e APP_ANDROID_ACCEPT_SDK_LICENSE=true \
            --entrypoint /bin/bash \
            ghcr.io/kivy/buildozer:latest -s <<'CONTAINER_SCRIPT'
          set -euo pipefail

          SDK=/root/.buildozer/android/platform/android-sdk
          mkdir -p "$SDK/licenses" "$SDK/tools/bin"

          REAL="$(find /root/.buildozer /github/home/.buildozer -type f -name sdkmanager 2>/dev/null | head -n1 || true)"

          if [ -z "$REAL" ]; then
            echo "sdkmanager не найден, скачиваем cmdline-tools..."
            curl -sSLo /tmp/cmdline.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            mkdir -p "$SDK/cmdline-tools"
            unzip -q /tmp/cmdline.zip -d "$SDK/cmdline-tools"
            mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
            REAL="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi

          echo "Используем sdkmanager: $REAL"

          ln -sf "$REAL" "$SDK/tools/bin/sdkmanager"
          mkdir -p /github/home/.buildozer/android/platform/android-sdk/tools/bin
          ln -sf "$REAL" /github/home/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager

          # КЛЮЧЕВОЕ: передаём "y" прямо в команду установки build-tools
          # Это обходит проблему, когда --licenses не срабатывает внутри Docker
          echo "Устанавливаем build-tools;34.0.0 с принудительным подтверждением..."
          printf 'y\ny\ny\ny\ny\n' | "$REAL" --sdk_root="$SDK" "platform-tools" "build-tools;34.0.0" 2>&1 || true

          # Проверка, повторная попытка если нужно
          if [ ! -d "$SDK/build-tools" ] || [ -z "$(ls -A "$SDK/build-tools" 2>/dev/null)" ]; then
            echo "::warning::Первая попытка не удалась, пробуем через yes..."
            yes | "$REAL" --sdk_root="$SDK" "build-tools;34.0.0" 2>&1 || true
          fi

          # Финальная проверка
          if [ ! -d "$SDK/build-tools" ] || [ -z "$(ls -A "$SDK/build-tools" 2>/dev/null)" ]; then
            echo "::error::build-tools всё ещё отсутствует!"
            ls -la "$SDK"
            exit 1
          fi

          echo "build-tools успешно установлены:"
          ls -la "$SDK/build-tools"

          # Патч для Python 3.14
          python - <<'PY'
          try:
              import buildozer.targets.android as a
              _orig = a.TargetAndroid._android_list_build_tools_versions
              def _safe(self):
                  try:
                      r = _orig(self)
                      return r if r else ['34.0.0']
                  except Exception:
                      return ['34.0.0']
              a.TargetAndroid._android_list_build_tools_versions = _safe
          except Exception as e:
              print(f"Patch skip: {e}")
          PY
          CONTAINER_SCRIPT

      - name: Build APK
        timeout-minutes: 60
        run: |
          docker run --rm -u 0:0 \
            -v "$(pwd)":/github/workspace \
            -w /github/workspace \
            -e BUILDOZER_WARN_ON_ROOT=0 \
            -e APP_ANDROID_ACCEPT_SDK_LICENSE=true \
            ghcr.io/kivy/buildozer:latest android debug

      - name: Fix ownership
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" .buildozer bin 2>/dev/null || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MediaDownloader-APK-${{ env.date }}
          path: bin/*.apk
          if-no-files-found: error
