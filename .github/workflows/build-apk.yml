name: Build Mobile App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get Date
        id: get-date
        run: echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_ENV"

      - name: Prepare SDK inside container
        timeout-minutes: 30
        run: |
          docker run --rm -u 0:0 \
            -v "$(pwd)":/github/workspace \
            -w /github/workspace \
            -e BUILDOZER_WARN_ON_ROOT=0 \
            --entrypoint /bin/bash \
            ghcr.io/kivy/buildozer:latest -s <<'CONTAINER_SCRIPT'
          set -euo pipefail
          echo "скрипт внутри контейнера"
          CONTAINER_SCRIPT

      - name: Build APK
        timeout-minutes: 60
        run: |
          docker run --rm -u 0:0 \
            -v "$(pwd)":/github/workspace \
            -w /github/workspace \
            -e BUILDOZER_WARN_ON_ROOT=0 \
            ghcr.io/kivy/buildozer:latest android debug
