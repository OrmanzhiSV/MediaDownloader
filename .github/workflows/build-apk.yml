name: Run Buildozer inside Self-Healing Container
  run: |
    docker run --rm -u 0:0 \
      -v "$(pwd)":/github/workspace \
      -w /github/workspace \
      -e BUILDOZER_WARN_ON_ROOT=0 \
      --entrypoint /bin/bash \
      ghcr.io/kivy/buildozer:latest -s <<'CONTAINER_SCRIPT'
        set -euo pipefail
        # ... весь скрипт БЕЗ \$ и \" ...
      CONTAINER_SCRIPT
      


name: Build APK
  timeout-minutes: 45
  run: |
    docker run --rm -u 0:0 \
      -v "$(pwd)":/github/workspace -w /github/workspace \
      -e BUILDOZER_WARN_ON_ROOT=0 \
      ghcr.io/kivy/buildozer:latest buildozer -v android debug

name: Fix ownership
  if: always()
  run: sudo chown -R "$(id -u):$(id -g)" .buildozer bin 2>/dev/null || true

- name: Upload APK
  uses: actions/upload-artifact@v4
  with:
    name: MediaDownloader-APK-${{ env.date }}
    path: bin/*.apk
    if-no-files-found: error
