name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Get Date
      id: get-date
      run: |
        echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platform-tools'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libsqlite3-dev lld cmake libffi-dev libssl-dev autoconf automake libtool pkg-config zlib1g-dev ccache texinfo git
        python -m pip install --upgrade pip
        # Устанавливаем сам движок python-for-android и необходимые для сборки утилиты
        python -m pip install "Cython<3.0.0" virtualenv setuptools wheel python-for-android jinja2 sh appdirs colorama

    - name: Build APK with python-for-android
      run: |
        # 1. Принимаем лицензии в системном SDK
        yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
        
        # 2. Регистрируем системные пути к Android SDK и NDK для компилятора
        export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
        export ANDROID_NDK_ROOT=/usr/local/lib/android/sdk/ndk-bundle
        
        # 3. Запускаем прямую сборку APK, минуя Buildozer
        p4a apk \
          --private . \
          --package=org.ormanzhisv.mediadownloader \
          --name="Media Downloader" \
          --version=1.0.0 \
          --bootstrap=sdl2 \
          --requirements=python3,kivy==2.3.0,requests,yt-dlp,urllib3,certifi,idna,jnius,android \
          --arch=arm64-v8a \
          --arch=armeabi-v7a \
          --release

        # 4. Переносим готовый файл в стандартную папку для выгрузки
        mkdir -p bin
        cp *.apk bin/ 2>/dev/null || cpDist=$(find . -name "*.apk") && cp $cpDist bin/ || true

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MediaDownloader-APK-${{ env.date }}
        path: bin/*.apk
