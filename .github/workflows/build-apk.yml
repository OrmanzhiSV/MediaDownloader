name: Build Mobile App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Get Date
      id: get-date
      run: |
        echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

    # Исправление парсера Python 3.14:
    # 1. Принимает лицензии Google во всех профилях.
    # 2. Перехватывает вызов 'buildozer android debug' при первом падении.
    # 3. Генерирует эмулятор ответа sdkmanager, отдающий текстовую структуру build-tools для split().
    - name: Run Buildozer inside Self-Healing Container
      run: |
        docker run --rm \
          -u 0:0 \
          -v "$(pwd)":/github/workspace \
          -w /github/workspace \
          -e BUILDOZER_WARN_ON_ROOT=0 \
          -e APP_ANDROID_ACCEPT_SDK_LICENSE="true" \
          --entrypoint /bin/bash \
          ghcr.io/kivy/buildozer:latest -c "
            # Шаг А. Создаем папки и инжектируем лицензии Android SDK
            mkdir -p /root/.buildozer/android/platform/android-sdk/licenses
            mkdir -p /github/home/.buildozer/android/platform/android-sdk/licenses
            
            echo -e '\n893a5cd8e1b672669ab80f8db3ad48a32396d93a\n45f2d2d0b7b672669ab80f8db3ad48a32396d93a\n24333f1a50b6a8d67385315074ed226d875080be' > /root/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
            echo -e '\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910' > /root/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license
            
            cp -r /root/.buildozer/android/platform/android-sdk/licenses /github/home/.buildozer/android/platform/android-sdk/ || true

            # Шаг Б. Запускаем первичный цикл для развертывания NDK и SDK Google
            buildozer android debug || {
              echo 'Первичный цикл завершен с ошибкой путей. Разворачиваем эмулятор вывода для парсера split()...';
              
              # Создаем целевые бинарные папки проверок
              mkdir -p /root/.buildozer/android/platform/android-sdk/tools/bin/
              mkdir -p /github/home/.buildozer/android/platform/android-sdk/tools/bin/
              
              # Записываем сложный текстовый эмулятор sdkmanager.
              # Он принудительно возвращает строки, имитирующие установленные компоненты, чтобы .split('\n') не падал!
              echo '#!/bin/bash' > /root/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
              echo 'echo \"Installed packages:\"' >> /root/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
              echo 'echo \"  build-tools;34.0.0 | 34.0.0 | Android SDK Build-Tools 34\"' >> /root/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
              echo 'echo \"  platform-tools | 34.0.5 | Android SDK Platform-Tools\"' >> /root/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
              echo 'echo \"Available Packages:\"' >> /root/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
              echo 'echo \"  build-tools;34.0.0 | 34.0.0 | Android SDK Build-Tools 34\"' >> /root/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
              echo 'exit 0' >> /root/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
              
              # Даем права на исполнение и дублируем во второй профиль контейнера
              chmod +x /root/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
              cp /root/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager /github/home/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
              chmod +x /github/home/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
              
              echo 'Шаг В. Перезапуск компиляции с готовым строковым выводом для Python.';
              buildozer android debug
            }
          "

    # Сбор готового APK файла
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MediaDownloader-APK-${{ env.date }}
        path: |
          bin/*.apk
          .buildozer/**/*.apk
          **/*.apk
