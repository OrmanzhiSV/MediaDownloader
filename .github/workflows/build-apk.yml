name: Build Mobile App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Get Date
      id: get-date
      run: |
        echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platform-tools'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libsqlite3-dev lld cmake libffi-dev libssl-dev autoconf automake libtool pkg-config zlib1g-dev ccache texinfo git
        python -m pip install --upgrade pip
        python -m pip install "Cython<3.0.0" wheel setuptools virtualenv python-for-android jinja2 sh appdirs colorama build

    - name: Build APK with python-for-android
      run: |
        yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
        
        # Полная административная очистка временных системных папок перед стартом
        sudo rm -rf /tmp/pip-*
        sudo rm -rf /home/runner/.cache/pip
        sudo rm -rf /root/.cache/pip
        rm -rf /home/runner/.local/share/python-for-android/
        rm -rf ~/.local/share/python-for-android/
        rm -rf .buildozer/
        rm -rf ~/.buildozer/
        
        export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
        export ANDROID_NDK_ROOT=/usr/local/lib/android/sdk/ndk-bundle
        
        # Тотальное подавление изоляции сред во всех системных утилитах
        export PYTHON_BUILD_NO_ISOLATION=1
        export P4A_NO_BUILD_ISOLATION=1
        export PIP_NO_BUILD_ISOLATION=0
        export PIP_USE_PEP517=no
        export P4A_python3_version="3.11.9"

        # ХАК ВСЕЙ СИСТЕМЫ СБОРКИ: Создаем скрипт-перехватчик sitecustomize.py для глобального Python.
        # Он найдет скрытые вызовы 'python -m build' внутри p4a и насильно добавит аргументы
        # '--no-isolation' и '--skip-dependency-check', ликвидируя ошибку ModuleNotFoundError: Cython.
        SITE_DIR=$(python -c "import site; print(site.getsitepackages()[0])")
        echo "import sys" > \$SITE_DIR/sitecustomize.py
        echo "if 'build' in sys.argv and '--wheel' in sys.argv:" >> \$SITE_DIR/sitecustomize.py
        echo "    if '--no-isolation' not in sys.argv:" >> \$SITE_DIR/sitecustomize.py
        echo "        sys.argv.extend(['--no-isolation', '--skip-dependency-check'])" >> \$SITE_DIR/sitecustomize.py

        p4a apk \
          --private . \
          --package=org.ormanzhisv.mediadownloader \
          --name="Media Downloader" \
          --version=1.0.0 \
          --bootstrap=sdl2 \
          --requirements=hostpython3,python3,kivy==2.3.0,requests,yt-dlp,urllib3,certifi,idna \
          --arch=arm64-v8a \
          --arch=armeabi-v7a \
          --android-api 34 \
          --skip-dependency-check \
          --release

        mkdir -p bin
        cp *.apk bin/ 2>/dev/null || cpDist=\$(find . -name "*.apk") && cp \$cpDist bin/ || true

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MediaDownloader-APK-${{ env.date }}
        path: bin/*.apk
