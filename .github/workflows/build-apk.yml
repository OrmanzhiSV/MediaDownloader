name: Build Mobile App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Get Date
      id: get-date
      run: |
        echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

    # Используем официальный, 100% доступный Docker-образ Kivy из внутреннего реестра GitHub (ghcr.io)
    # Это полностью решает проблему ошибок "manifest unknown" на Docker Hub и обходит баги pip/Cython
    with:
      image: 'ghcr.io/kivy/buildozer:latest'
      options: --user root -v ${{ github.workspace }}:/home/user/hostpath
    - name: Build APK inside GitHub Container
      uses: docker://ghcr.io/kivy/buildozer:latest
      with:
        args: buildozer android debug
      env:
        BUILDOZER_WARN_ON_ROOT: 0

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MediaDownloader-APK-${{ env.date }}
        path: bin/*.apk
