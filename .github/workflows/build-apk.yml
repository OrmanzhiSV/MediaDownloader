name: Build Mobile App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Get Date
      id: get-date
      run: |
        echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

    # Чистый запуск Docker. Мы используем встроенный в контейнер Android SDK, который авторы Kivy
    # уже настроили и протестировали. Перед компиляцией мы просто копируем лицензии в профиль root.
    - name: Run Buildozer via Manual Docker
      run: |
        docker run --rm \
          -u 0:0 \
          --entrypoint bash \
          -v "$(pwd)":/github/workspace \
          -w /github/workspace \
          -e BUILDOZER_WARN_ON_ROOT=0 \
          ghcr.io/kivy/buildozer:latest -c "
            # 1. Принудительно создаем папку для лицензий в системном профиле контейнера
            mkdir -p /root/.buildozer/android/platform/android-sdk/licenses
            
            # 2. Напрямую подписываем лицензии Google внутри контейнера, полностью минуя любые запросы (y/N)
            echo -e '\n893a5cd8e1b672669ab80f8db3ad48a32396d93a\n45f2d2d0b7b672669ab80f8db3ad48a32396d93a\n24333f1a50b6a8d67385315074ed226d875080be' > /root/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
            echo -e '\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910' > /root/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license
            
            # 3. Запускаем компиляцию приложения на базе встроенного, проверенного SDK
            buildozer android debug
          "

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MediaDownloader-APK-${{ env.date }}
        path: bin/*.apk
