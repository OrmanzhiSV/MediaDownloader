name: Build Mobile App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Get Date
      id: get-date
      run: |
        echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

    # Сборка через ручной Docker.
    # Мы принудительно перенаправляем Buildozer на встроенный в Docker-образ Android SDK и NDK.
    # Это полностью заблокирует скачивание дубликатов из интернета и обойдет баг с отсутствием папки tools/bin!
    - name: Run Buildozer via Manual Docker
      run: |
        docker run --rm \
          -v "$(pwd)":/github/workspace \
          -w /github/workspace \
          -e BUILDOZER_WARN_ON_ROOT=0 \
          ghcr.io/kivy/buildozer:latest bash -c "
            # Экспортируем железные пути к SDK и NDK, которые уже предустановлены авторами Kivy внутри контейнера
            export ANDROID_SDK_ROOT=/home/user/.buildozer/android/platform/android-sdk
            export ANDROID_NDK_ROOT=/home/user/.buildozer/android/platform/android-ndk-r25b
            
            # Запускаем компиляцию приложения напрямую
            buildozer android debug
          "

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MediaDownloader-APK-${{ env.date }}
        path: bin/*.apk
