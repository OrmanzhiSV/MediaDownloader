name: Build Mobile App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Get Date
      id: get-date
      run: |
        echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

    # Глобальное кэширование предобученного SDK хоста
    - name: Cache Buildozer Global Tooling
      uses: actions/cache@v4
      with:
        path: .buildozer_host
        key: ${{ runner.os }}-buildozer-v8-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          ${{ runner.os }}-buildozer-v8-

    # Шаг 1. Надежная предустановка Android SDK на хост-машине Ubuntu через wget
    - name: Pre-install Official Android SDK on Host
      run: |
        if [ ! -d ".buildozer_host/android/platform/android-sdk/build-tools/34.0.0" ]; then
          echo "Кэш пуст. Начинаем чистую загрузку оригинального Android SDK..."
          
          # Создаем структуру каталогов, строго соответствующую требованиям Google Repository
          mkdir -p .buildozer_host/android/platform/android-sdk/cmdline-tools
          cd .buildozer_host/android/platform/android-sdk/cmdline-tools
          
          # Используем надежный wget с повтором попыток вместо curl
          wget --quiet --tries=5 --connect-timeout=20 https://google.com -o wget.log || {
            echo "Ошибка: Не удалось подключиться к серверам Google"
            cat wget.log
            exit 1
          }
          
          # Проверяем, что файл физически существует и имеет размер больше 10 МБ
          if [ ! -f "commandlinetools-linux-11076708_latest.zip" ] || [ $(stat -c%s "commandlinetools-linux-11076708_latest.zip") -lt 10000000 ]; then
            echo "Критическая ошибка: Архив cmdline-tools скачался поврежденным или пустым."
            exit 1
          fi
          
          # Распаковываем легитимные инструменты командной строки
          unzip -q commandlinetools-linux-11076708_latest.zip && rm commandlinetools-linux-11076708_latest.zip
          
          # Переименовываем распакованную корневую папку под стандарт 'latest', требуемый sdkmanager
          mv cmdline-tools latest
          
          # Нативно принимаем все лицензии на стабильном хосте Ubuntu
          echo "y" | latest/bin/sdkmanager --sdk_root=../ "build-tools;34.0.0" "platform-tools" "platforms;android-34"
          
          cd ../../../../..
        else
          echo "Валидный Android SDK с предустановленным AIDL успешно восстановлен из кэша."
        fi

    # Шаг 2. Запуск Docker-контейнера со сквозным маппингом и фиксацией дуальных требований Python
    - name: Run Buildozer inside Mounted SDK Container
      run: |
        # Гарантируем права root для Docker на запись в кэш хоста
        chmod -R 777 .buildozer_host
        
        # 1. Принудительно инжектируем точный путь к SDK и запрещаем сетевые обновления
        sed -i 's|^#\s*android.sdk_path\s*=.*|android.sdk_path = /root/.buildozer/android/platform/android-sdk|g' buildozer.spec
        sed -i 's|^android.sdk_path\s*=.*|android.sdk_path = /root/.buildozer/android/platform/android-sdk|g' buildozer.spec
        sed -i 's|^#\s*android.skip_update\s*=.*|android.skip_update = True|g' buildozer.spec
        sed -i 's|^android.skip_update\s*=.*|android.skip_update = True|g' buildozer.spec
        
        # 2. ИСПРАВЛЕННЫЙ ТАРГЕТ Python:
        # Передаем связанные версии hostpython3 и python3 через ==, принуждая p4a скомпилировать Python 3.11.9 локально.
        sed -i 's|^requirements\s*=.*|requirements = hostpython3==3.11.9,python3==3.11.9,kivy==2.3.0,yt-dlp,requests|g' buildozer.spec

        docker run --rm \
          -u 0:0 \
          -v "$(pwd)":/github/workspace \
          -v "$(pwd)/.buildozer_host":/root/.buildozer \
          -w /github/workspace \
          -e BUILDOZER_WARN_ON_ROOT=0 \
          -e APP_ANDROID_ACCEPT_SDK_LICENSE="true" \
          --entrypoint /bin/bash \
          ghcr.io/kivy/buildozer:latest -c "
            # Настройка переменных окружения внутри контейнера
            export ANDROID_HOME=/root/.buildozer/android/platform/android-sdk
            export ANDROID_SDK_ROOT=/root/.buildozer/android/platform/android-sdk
            export PATH=\$ANDROID_HOME/cmdline-tools/latest/bin:\$ANDROID_HOME/platform-tools:\$PATH
            
            echo '=== СОЗДАНИЕ И ВЕРИФИКАЦИЯ СИМЛИНКОВ ВНУТРИ КОНТЕЙНЕРА ==='
            mkdir -p /root/.buildozer/android/platform/android-sdk/tools/bin
            ln -sf /root/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager /root/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
            
            test -f /root/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager && echo 'tools/bin/sdkmanager: FOUND' || echo 'tools/bin/sdkmanager: NOT FOUND'
            test -f /root/.buildozer/android/platform/android-sdk/build-tools/34.0.0/aidl && echo 'build-tools/34.0.0/aidl (REAL GOOGLE AIDL): FOUND' || echo 'build-tools/aidl: NOT FOUND'
            echo '====================================================================='
            
            echo 'Проверка инжектированных требований в buildozer.spec:'
            grep -E 'android.sdk_path|requirements' buildozer.spec
            echo '====================================================================='
            
            # Запуск компиляции в детальном (verbose) режиме
            buildozer -v android debug 2>&1
          "

    # Шаг 3. Сохранение готового APK
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MediaDownloader-APK-${{ env.date }}
        path: |
          bin/*.apk
          **/*.apk
