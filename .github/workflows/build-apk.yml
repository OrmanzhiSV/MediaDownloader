jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get Date
        id: get-date
        run: echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_ENV"

      - name: Prepare SDK inside container
        timeout-minutes: 20
        run: |
          docker run --rm -u 0:0 \
            -v "$(pwd)":/github/workspace \
            -w /github/workspace \
            -e BUILDOZER_WARN_ON_ROOT=0 \
            --entrypoint /bin/bash \
            ghcr.io/kivy/buildozer:latest -s <<'CONTAINER_SCRIPT'
          set -euo pipefail
          SDK=/root/.buildozer/android/platform/android-sdk
          mkdir -p "$SDK/licenses" "$SDK/tools/bin"
          # ... остальной скрипт ...
          CONTAINER_SCRIPT

      - name: Build APK
        timeout-minutes: 45
        run: |
          docker run --rm -u 0:0 \
            -v "$(pwd)":/github/workspace \
            -w /github/workspace \
            -e BUILDOZER_WARN_ON_ROOT=0 \
            ghcr.io/kivy/buildozer:latest android debug

      - name: Fix ownership
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" .buildozer bin 2>/dev/null || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MediaDownloader-APK-${{ env.date }}
          path: bin/*.apk
          if-no-files-found: error
