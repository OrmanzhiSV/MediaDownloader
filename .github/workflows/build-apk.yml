name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Get Date
      id: get-date
      run: |
        echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # Шаг 1: Правильно настраиваем Java 17, которая необходима для Android SDK
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # Шаг 2: Принудительно предустанавливаем официальный Android SDK и автоматически принимаем все лицензии
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libsqlite3-dev lld cmake libffi-dev libssl-dev autoconf automake libtool pkg-config zlib1g-dev ccache textinfo
        pip install --upgrade pip
        pip install "Cython<3.0.0" buildozer virtualenv setuptools wheel

    # Шаг 3: Сообщаем Buildozer, где лежат уже установленные и лицензированные инструменты SDK
    - name: Build with Buildozer
      run: |
        # Экшен setup-android автоматически сохраняет пути в переменные окружения, передаем их в Buildozer
        export ANDROID_SDK_ROOT=$ANDROID_HOME
        
        # Запускаем сборку
        buildozer android debug
      env:
        BUILDOZER_WARN_ON_ROOT: 0

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MediaDownloader-APK-${{ env.date }}
        path: bin/*.apk
