name: Build Mobile App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Get Date
      id: get-date
      run: |
        echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

    - name: Cache Buildozer Global Tooling
      uses: actions/cache@v4
      with:
        path: .buildozer_host
        key: ${{ runner.os }}-buildozer-v23-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          ${{ runner.os }}-buildozer-v23-

    - name: Pre-install Official Android SDK on Host
      run: |
        if [ ! -d ".buildozer_host/android/platform/android-sdk/build-tools/34.0.0" ]; then
          echo "Кэш пуст. Начинаем чистую загрузку оригинального Android SDK..."
          
          mkdir -p .buildozer_host/android/platform/android-sdk/cmdline-tools
          cd .buildozer_host/android/platform/android-sdk/cmdline-tools
          
          curl --fail --location --retry 3 --retry-delay 2 --retry-connrefused \
               --show-error \
               -o cmdline-tools.zip \
               https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          
          unzip -t cmdline-tools.zip > /dev/null 2>&1 || {
            echo "::error::Скачанный zip повреждён."
            rm -f cmdline-tools.zip
            exit 1
          }
          
          unzip -q cmdline-tools.zip && rm cmdline-tools.zip
          
          if [ ! -d "cmdline-tools" ]; then
            echo "::error::После распаковки не найдена папка cmdline-tools"
            exit 1
          fi
          
          mv cmdline-tools latest
          
          echo "y" | latest/bin/sdkmanager --sdk_root=../ "build-tools;34.0.0" "platform-tools" "platforms;android-34"
          
          cd ../../../../..
        else
          echo "Валидный Android SDK восстановлен из кэша."
        fi

    - name: Run Buildozer inside Python 3.11 Container
      run: |
        chmod -R 777 .buildozer_host
        
        sed -i 's|^#\s*android.sdk_path\s*=.*|android.sdk_path = /root/.buildozer/android/platform/android-sdk|g' buildozer.spec
        sed -i 's|^android.sdk_path\s*=.*|android.sdk_path = /root/.buildozer/android/platform/android-sdk|g' buildozer.spec
        sed -i 's|^#\s*android.skip_update\s*=.*|android.skip_update = True|g' buildozer.spec
        sed -i 's|^android.skip_update\s*=.*|android.skip_update = True|g' buildozer.spec
        sed -i 's|^requirements\s*=.*|requirements = python3==3.11.9,hostpython3==3.11.9,kivy,cython==0.29.34,yt-dlp,requests|g' buildozer.spec
        sed -i 's|^#\s*p4a.local_recipes\s*=.*|p4a.local_recipes = /github/workspace/p4a-recipes|g' buildozer.spec
        sed -i 's|^p4a.local_recipes\s*=.*|p4a.local_recipes = /github/workspace/p4a-recipes|g' buildozer.spec
        sed -i 's|^#\s*p4a.branch\s*=.*|p4a.branch = develop|g' buildozer.spec
        sed -i 's|^p4a.branch\s*=.*|p4a.branch = develop|g' buildozer.spec

        docker run --rm \
          -v "$(pwd)":/github/workspace \
          -v "$(pwd)/.buildozer_host":/root/.buildozer \
          -w /github/workspace \
          -e BUILDOZER_WARN_ON_ROOT=0 \
          -e APP_ANDROID_ACCEPT_SDK_LICENSE="true" \
          --entrypoint /bin/bash \
          python:3.11-bookworm -c "
            echo '=== ШАГ А: УСТАНОВКА СИСТЕМНЫХ ЗАВИСИМОСТЕЙ ==='
            apt-get update && apt-get install -y --no-install-recommends \
              openjdk-17-jdk-headless git zip unzip xclip curl wget libffi-dev \
              libssl-dev autoconf automake libtool pkg-config zlib1g-dev \
              build-essential ccache libncurses-dev
            
            echo '=== ШАГ Б: УСТАНОВКА ИНСТРУМЕНТОВ СБОРКИ ==='
            # 全局 pip 仍保持较新版本,但下面会 patch p4a 阻止它在 venv 里盲目升级 pip
            pip install --no-cache-dir --upgrade pip setuptools wheel 'Cython<3.0' legacy-cgi buildozer
            
            echo '=== ШАГ В: НАСТРОЙКА ОКРУЖЕНИЯ ==='
            export ANDROID_HOME=/root/.buildozer/android/platform/android-sdk
            export ANDROID_SDK_ROOT=/root/.buildozer/android/platform/android-sdk
            export PATH=\$ANDROID_HOME/cmdline-tools/latest/bin:\$ANDROID_HOME/platform-tools:\$PATH
            
            # 清除旧 venv,确保 p4a 新建一个
            rm -rf /root/.buildozer/android/platform/build-*/build/venv
            
            mkdir -p /root/.buildozer/android/platform/android-sdk/tools/bin
            ln -sf /root/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager /root/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
            
            echo '=== ШАГ Г: ПАТЧ P4A — ЗАПРЕТ ОБНОВЛЕНИЯ PIP В VENV ==='
            # 关键: 在 buildozer 克隆 p4a 之前无法 patch,因此先让 buildozer 准备 p4a(但此时不要真正构建)
            # 更稳妥的做法是: 直接 patch 可能存在的 p4a 副本,并清理后让 buildozer 重新克隆
            # 但 p4a 是在 buildozer 运行时才克隆的,所以这里用另一种策略: 在 p4a 克隆后、构建前注入 patch
            # 实际上无法在单条 docker run 中完美做到,因此改为: 让 buildozer 先失败一次,然后 patch,再重试
            # 但这样太绕。最直接的方法是使用 PIP_CONSTRAINT 或修改 pip 行为
            
            # 改用更直接的方法: 设置 PIP 环境变量,让 pip 在 venv 中不升级到有问题的版本
            export PIP_CONSTRAINT=/github/workspace/constraints.txt
            echo 'pip==23.3.2' > /github/workspace/constraints.txt
            
            echo '=== ШАГ Д: ЗАПУСК СБОРКИ ==='
            buildozer -v android debug 2>&1
          "

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MediaDownloader-APK-${{ env.date }}
        path: |
          bin/*.apk
          **/*.apk
