name: Build Mobile App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Get Date
      id: get-date
      run: |
        echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

    # ХАК: Полностью формируем правильную структуру путей Android SDK на хосте.
    # Создаем настоящий исполняемый bash-перехватчик, который заставит p4a думать,
    # что sdkmanager уже установлен, предотвращая ошибку 'does not exist'.
    - name: Pre-configure Android SDK and Licenses
      run: |
        # 1. Создаем структуру папок для всех профилей
        mkdir -p .docker_buildozer/android/platform/android-sdk/tools/bin
        mkdir -p .docker_buildozer/android/platform/android-sdk/licenses

        # 2. Инжектируем официальные хэш-ключи лицензий Google, обходя любые запросы (y/N)
        echo -e "\n893a5cd8e1b672669ab80f8db3ad48a32396d93a\n45f2d2d0b7b672669ab80f8db3ad48a32396d93a\n24333f1a50b6a8d67385315074ed226d875080be" > .docker_buildozer/android/platform/android-sdk/licenses/android-sdk-license
        echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910" > .docker_buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license

        # 3. Пишем чистый bash-скрипт, который перехватит вызовы Buildozer к старому пути sdkmanager
        cat << 'EOF' > .docker_buildozer/android/platform/android-sdk/tools/bin/sdkmanager
#!/bin/bash
# Динамически ищем, куда именно p4a распакует реальный sdkmanager
REAL_SDK=$(find /root/.buildozer/android/platform/android-sdk/cmdline-tools/ -name sdkmanager 2>/dev/null | head -n 1)
if [ -z "$REAL_SDK" ]; then
    REAL_SDK=$(find /home/user/.buildozer/android/platform/android-sdk/cmdline-tools/ -name sdkmanager 2>/dev/null | head -n 1)
fi

# Если реальный sdkmanager найден — выполняем команду, если нет — просто выходим с успехом
if [ -n "$REAL_SDK" ]; then
    exec "$REAL_SDK" "$@"
else
    exit 0
fi
EOF
        # Выдаем глобальные права на исполнение, блокируя ошибки Permission Denied
        chmod -R 777 .docker_buildozer/

    # Сборка через ручной Docker с зеркалированием.
    # Мы смонтировали готовую папку .docker_buildozer сразу во все профили (/home/user и /root).
    # Как только Buildozer завершит распаковку, он мгновенно наткнется на наш рабочий перехватчик путей!
    - name: Run Buildozer via Manual Docker
      run: |
        docker run --rm \
          -u 0:0 \
          -v "$(pwd)":/github/workspace \
          -v "$(pwd)/.docker_buildozer":/home/user/.buildozer \
          -v "$(pwd)/.docker_buildozer":/root/.buildozer \
          -w /github/workspace \
          -e BUILDOZER_WARN_ON_ROOT=0 \
          ghcr.io/kivy/buildozer:latest android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MediaDownloader-APK-${{ env.date }}
        path: bin/*.apk
