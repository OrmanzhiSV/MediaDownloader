    # Сборка приложения
    - name: Build with Buildozer
      run: |
        # Передаем Buildozer пути к предустановленному и лицензированному Android SDK и NDK
        export ANDROID_SDK_ROOT=$ANDROID_HOME
        export ANDROID_NDK_ROOT=$ANDROID_HOME/ndk-bundle
        
        # На всякий случай дублируем файлы лицензий в локальную папку Buildozer, если он решит проверить их там
        mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
        cp -r $ANDROID_HOME/licenses/* ~/.buildozer/android/platform/android-sdk/licenses/ 2>/dev/null || true
        
        # Принудительно соглашаемся со всеми внутренними запросами
        yes | buildozer android debug
      env:
        BUILDOZER_WARN_ON_ROOT: 0
